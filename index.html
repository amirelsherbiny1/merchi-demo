function filterName(f){return txt(({all:pair('All transactions','كل المعاملات'),mine:pair('Needs my action','يتطلب إجرائي'),active:pair('Active','نشط'),complete:pair('Completed','مكتمل'),attention:pair('Needs attention','يتطلب المتابعة'),approval:pair('Internal approvals','الاعتمادات الداخلية'),confirmation:pair('Order confirmation','تأكيد الطلب'),delivery:pair('Delivery coordination','تنسيق التسليم'),receipt:pair('Receipt & exceptions','الاستلام والاستثناءات')})[f]||pair(f,f))}

function renderCompanies(){const rels=companyRelationships();return `${pageHead(t('Your existing business relationships.','علاقاتك التجارية الحالية.'),t('One company channel, with transactions inside it. No personal chats. No marketplace.','قناة واحدة لكل شركة، ومعاملات بداخلها. لا محادثات شخصية ولا سوق تجاري.'))}<div class="work-intro"><span class="spark">${icon('link')}</span><p>${t('Works even when the other company has not joined. Connected partners share structured updates; other channels stay available.','يعمل حتى عندما لا تنضم الشركة الأخرى. تتبادل الشركات المتصلة تحديثات منظمة وتظل القنوات الأخرى متاحة.')}</p></div><div class="customer-grid">${rels.map(r=>{const id=r[ui.side==='seller'?'buyer':'seller'],os=visibleOrders().filter(o=>o.buyer===r.buyer&&o.seller===r.seller),active=os.filter(o=>!isComplete(o)),needed=os.filter(o=>ownTasks(o).length);return `<article class="panel customer-card">${companyMark(id)}<h2>${tx(company(id).name)}</h2><p>${tx(company(id).kind)} · ${t('Illustrative partner','شريك توضيحي')}</p><span class="connected ${r.connected?'':'bridge'}">${r.connected?t('Rych connected','متصل عبر Rych'):E(r.channel)+' · '+t('not yet connected','غير متصل بعد')}</span><div class="channel-stats"><div><b>${active.length}</b><span>${t('Active','نشط')}</span></div><div><b>${needed.length}</b><span>${t('With our team','لدى فريقنا')}</span></div><div><b>${os.length}</b><span>${t('Transactions','معاملات')}</span></div></div><div class="mt24">${linkButton(t('Open company channel','فتح قناة الشركة'),'channel',r.id)}</div></article>`}).join('')}</div>`}
function renderChannel(){const r=state.relationships.find(r=>r.id===ui.channel);if(!r||r[ui.side]!==activeCompany())return permissionPage();const other=r[ui.side==='seller'?'buyer':'seller'];const orders=visibleOrders().filter(o=>o.buyer===r.buyer&&o.seller===r.seller);return `<div class="back">${linkButton(t('Company channels','قنوات الشركات'),'nav','companies','back')}</div>${pageHead(tx(company(other).name),t('Your company-to-company transaction channel. People change; the relationship stays.','قناتك للمعاملات بين الشركتين. يتغير الأشخاص وتبقى العلاقة.'),!r.connected?button(t('Connect this company','ربط هذه الشركة'),'invite',r.id,'primary','link'):'')}<div class="relationship-bar"><div class="relationship-identity">${companyMark(activeCompany())}<b>${tx(company(activeCompany()).name)}</b></div>${icon('link')}<div class="relationship-identity">${companyMark(other)}<b>${tx(company(other).name)}</b></div><span class="connection-end connected ${r.connected?'':'bridge'}">${r.connected?t('Shared Rych channel','قناة Rych مشتركة'):t('Bridged through ','متصلة عبر ')+E(r.channel)}</span></div><div class="detail-grid"><section><div class="panel"><div class="panel-head"><h2>${t('Transactions in this relationship','المعاملات ضمن هذه العلاقة')}</h2><span class="count-badge">${orders.length}</span></div>${orders.length?orderRows(orders):`<div class="empty-compact">${t('No transactions yet. This existing relationship is ready when you are.','لا توجد معاملات بعد. هذه العلاقة الحالية جاهزة عند حاجتك.')}</div>`}</div>${!r.connected?`<div class="rail-note"><h3>${t('Invite through the work itself.','الدعوة من خلال العمل نفسه.')}</h3><p>${t('Your partner can respond to a single transaction first, then claim a company workspace. Joining does not expose private notes or other relationships.','يمكن للشريك الاستجابة لمعاملة واحدة أولًا ثم تفعيل مساحة شركته. الانضمام لا يكشف الملاحظات الخاصة أو العلاقات الأخرى.')}</p>${button(t('Preview the invitation','معاينة الدعوة'),'invite',r.id)}</div>`:''}</section><aside class="stack"><section class="panel rail-section"><h3>${t('Channel boundaries','حدود القناة')}</h3><dl class="facts"><div><dt>${t('Identity','الهوية')}</dt><dd>${t('Company ↔ Company','شركة ↔ شركة')}</dd></div><div><dt>${t('Visibility','الرؤية')}</dt><dd>${t('Agreed and published records','السجلات المنشورة والمتفق عليها')}</dd></div><div><dt>${t('Private workflow','العمل الداخلي')}</dt><dd>${t('Stays in each company','يبقى داخل كل شركة')}</dd></div></dl><p class="mt16">${t('Connection is not consent to reveal all business data. Each published action has a sender, timestamp and record version.','الربط ليس موافقة على كشف كل بيانات العمل. لكل إجراء منشور جهة مرسلة ووقت ونسخة سجل.')}</p></section><section class="panel rail-section"><h3>${t('Working channels','قنوات العمل')}</h3><p>${r.connected?t('Structured confirmations, appointment proposals and receipt issues stay inside each transaction.','تبقى التأكيدات المنظمة ومقترحات المواعيد وملاحظات الاستلام داخل كل معاملة.'):t('The prototype demonstrates an existing-channel bridge. Actual email, WhatsApp and portal adapters are not connected.','يوضح النموذج ربط القنوات الحالية. الربط الفعلي بالبريد وواتساب والبوابات غير مفعل.')}</p></section></aside></div>`}
function stepStrip(o){const stages=[['approval',t('Approval','الاعتماد')],['confirmation',t('Confirmation','التأكيد')],['delivery',t('Delivery','التسليم')],['receipt',t('Receipt','الاستلام')],['complete',t('Completion','الإكمال')]];const group=phaseGroup(o);const idx=stages.findIndex(x=>x[0]===group);return `<div class="stage-progress" aria-label="${t('Transaction journey','مراحل المعاملة')}">${stages.map(([k,name],i)=>{const past=(i===0&&o.sent)||(i===1&&!!o.agreed)||(i===2&&!!o.delivery?.outcome)||(i===3&&o.phase==='complete');const now=k===group&&!['rejected','cancelled'].includes(o.phase);return `<div class="s-step ${past?'done':now?'now':''}"><span class="circle">${past?'✓':i+1}</span><span>${name}${k==='complete'&&o.phase==='rejected'?'<br>'+t('Declined','مرفوض'):''}</span></div>`}).join('')}</div>`}
function transactionHead(o){return `<div class="back">${linkButton(t('Back to transactions','العودة إلى المعاملات'),'nav','transactions','back')}</div>${pageHead(`<bdi>${E(o.po)}</bdi>`,tx(company(party(o)).name)+(o.replacement?.active?' · '+t('Replacement delivery','تسليم بديل'):''),`${badge(E(sharedStatus(o)),mine(o).length?'amber':isComplete(o)?'green':'')}`)}<div class="relationship-bar"><b>${tx(company(o.buyer).name)}</b>${icon('link')}<b>${tx(company(o.seller).name)}</b><span class="company-tag">${t('ONE TRANSACTION','معاملة واحدة')}</span><span class="connection-end">${connBadge(o)}</span></div>`}
function visibleShared(o){const events=latestVisibleEvents(o,'shared');return events}
function eventHtml(ev,o){const comp=ev.actorSide==='buyer'?o.buyer:o.seller;const priv=ev.scope!=='shared';return `<article class="timeline-event ${ev.actorSide===ui.side?'own':''}"><span class="event-mark">${priv?roleObj(ev.actorSide,ev.actorRole).initial:E(company(comp).initial)}</span><div class="event-main"><div class="event-by"><b>${priv?E(roleName(ev.actorSide,ev.actorRole))+' · '+E(roleLabel(ev.actorSide,ev.actorRole)):tx(company(comp).name)}</b><time>${timeLabel(ev.at)} · ${t('demo','تجريبي')}</time></div><div class="event-content"><h3>${tx(ev.title)}</h3><p dir="auto">${ev.userText?E(ev.userText):tx(ev.body)}</p>${ev.type==='po_sent'?`<div class="change-mini"><span><b>${o.lines.length}</b> ${t('product lines','بنود منتجات')}</span>${financialRole()?`<span>${money(val(o.lines))}</span>`:''}<span>${t('Requested:','المطلوب:')} ${dateLabel(o.requestedDate)}</span></div>`:''}${ev.type==='change_proposed'?`<div class="change-mini"><span>${t('Requested','المطلوب')}: <bdi>${n(o.lines[0].qty)}</bdi></span><span>${t('Proposed','المقترح')}: <b><bdi>${n((o.proposed||o.lines)[0].qty)}</bdi></b></span></div>${badge(t('A proposal, not an accepted change','مقترح وليس تعديلًا مقبولًا'),'amber')}`:''}${ev.type==='claim_published'?badge(t('Reported by buyer · awaiting response','أبلغ عنه المشتري · بانتظار الرد'),'amber'):''}</div></div></article>`}
function sharedTimeline(o){const es=visibleShared(o);return `<div class="transaction-body"><div class="visibility-label">${icon('company')}${t('Shared with both companies · only published business events','مشترك بين الشركتين · إجراءات العمل المنشورة فقط')}</div>${es.map(ev=>eventHtml(ev,o)).join('')||`<div class="protected-preview">${icon('lock')}<h3>${t('Not sent to the supplier yet','لم يُرسل إلى المورد بعد')}</h3><p>${t('Internal preparation and approval stay private until Procurement sends the PO.','يبقى التجهيز والاعتماد داخليًا حتى ترسل المشتريات أمر الشراء.')}</p></div>`}</div>${o.sent&&['sales','procurement'].includes(ui.role)&&!isComplete(o)?composer(o,false):''}`}
function composer(o,priv){const k=(priv?'private':'shared')+'-'+ui.side+'-'+ui.role;return `<form class="composer" data-compose="${priv?'private':'shared'}" data-id="${o.id}"><label for="compose-${priv?'private':'shared'}">${icon(priv?'lock':'chat')}${priv?t('Internal note · your company only','ملاحظة داخلية · شركتك فقط'):t('Message the company about this transaction','رسالة للشركة بشأن هذه المعاملة')}</label><textarea id="compose-${priv?'private':'shared'}" name="message" maxlength="2000" dir="auto" placeholder="${priv?t('Add context for your team…','أضف معلومات لفريقك…'):t('Write to the company, not a personal chat…','اكتب للشركة، وليس لمحادثة شخصية…')}">${E(o.drafts?.[k]||'')}</textarea><div class="row"><span class="small muted">${priv?t('Never visible to the other company. Does not approve or change the order.','لا يظهر للشركة الأخرى. لا يعتمد الطلب أو يغيره.'):t('Messages add context. Use the action card to accept changes or make commitments.','الرسائل تضيف معلومات. استخدم بطاقة الإجراء لقبول التغييرات أو الالتزامات.')}</span><button class="btn ${priv?'':'primary'}" type="submit">${priv?t('Add internal note','إضافة ملاحظة داخلية'):t('Send company message','إرسال رسالة للشركة')}${icon('arrow')}</button></div><div class="error" role="alert"></div></form>`}
function internalPanel(o){const rlist=Object.entries(roles[ui.side]);const ts=ownTasks(o);const history=latestVisibleEvents(o,'private');return `<div class="transaction-body"><div class="private-note-header">${icon('lock')}<span>${t('Private to ','خاص بـ ')}<b>${tx(company(activeCompany()).name)}</b> · ${t('Not visible to the counterparty','غير ظاهر للشركة الأخرى')}</span></div><h3>${t('Who has the next move?','من المسؤول عن الخطوة التالية؟')}</h3><ul class="private-flow">${rlist.map(([r,ro])=>{const here=ts.filter(a=>a.role===r),hasAct=history.some(e=>e.actorRole===r);return `<li class="${here.length?'current':''}"><span class="avatar ${here.length?'':'ghost-avatar'}">${ro.initial}</span><div><strong>${tx(ro.name)} · ${tx(ro.label)}</strong><p>${here.length?here.map(x=>tx(x.title)).join(' · '):hasAct?t('Recorded work is in the history below.','العمل المسجل موجود في السجل أدناه.'):t('No action currently assigned.','لا إجراء مسند حاليًا.')}</p></div><span class="state">${here.length?t('Action required','إجراء مطلوب'):t('No action','لا إجراء')}</span></li>`}).join('')}</ul><div class="section-label"><h2>${t('Private activity','النشاط الداخلي')}</h2><span class="shy">${t('Role-scoped context','معلومات حسب الصلاحية')}</span></div>${history.map(e=>eventHtml(e,o)).join('')||`<p class="small muted">${t('No internal activity available to this role.','لا يوجد نشاط داخلي متاح لهذا الدور.')}</p>`}</div>${composer(o,true)}`}
function productTable(o,mode='full'){const showMoney=financialRole(),h=[t('Product','المنتج'),t('Requested','المطلوب'),o.agreed?t('Agreed','المتفق عليه'):t('Proposed','المقترح'),...(showMoney?[t('Unit price','سعر الوحدة')]:[])];return `<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${o.lines.map(l=>{const proposal=(o.agreed||o.proposed||[]).find(x=>x.id===l.id);const cells=[`<strong>${tx(l.name)}</strong><small><bdi>${E(l.sku)}</bdi> · ${tx(l.unit)}</small>`,`<bdi>${n(l.qty)}</bdi>`,proposal?`<bdi>${n(proposal.qty)}</bdi>${proposal.qty!==l.qty?`<small>${t('Original retained','الأصل محفوظ')}</small>`:''}`:t('Not confirmed','غير مؤكد'),...(showMoney?[money(l.price)]:[])];return `<tr>${cells.map((c,i)=>`<td data-column="${E(h[i])}">${c}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>${showMoney?`<div class="table-foot">${t('Original PO:','أمر الشراء الأصلي:')} ${money(val(o.lines))}${o.agreed?' · '+t('Agreed:','المتفق عليه:')+' '+money(val(o.agreed)):''} · ${t('Values exclude tax; no tax rate is inferred.','القيم دون الضريبة؛ لا يُفترض معدل ضريبي.')}</div>`:''}`}
function documentsPanel(o){const docs=[['po',t('Original purchase order','أمر الشراء الأصلي'),o.po],...(o.invoice&&financialRole()?[['invoice',t('ERP invoice · illustrative','فاتورة ERP · توضيحية'),o.invoice.ref]]:[]),...(o.receipt?[['receipt',t('Employee receiving report','تقرير استلام الموظف'),'REC-'+o.id]]:[]),...(o.delivery?.proof?[['proof',t('Delivery evidence','أدلة التسليم'),'POD-'+o.id]]:[])];return `<div class="transaction-body"><div class="visibility-label">${icon('order')}${t('Documents linked to this transaction. Sample documents are clearly marked.','مستندات مرتبطة بهذه المعاملة. المستندات النموذجية موضحة صراحةً.')}</div>${docs.map(([k,label,ref])=>`<div class="document-row"><span class="document-icon">${icon('order')}</span><div><h3>${label}</h3><p><bdi>${E(ref)}</bdi></p></div>${linkButton(t('Preview','معاينة'),'document',o.id+'|'+k)}</div>`).join('')}${o.sourceFile?`<div class="document-row"><span class="document-icon">${icon('paperclip')}</span><div><h3>${E(o.sourceFile.name)}</h3><p>${t('Original locally attached file','الملف الأصلي المرفق محليًا')}</p></div>${linkButton(t('Preview','معاينة'),'attachment',o.sourceFile.id)}</div>`:''}<p class="readiness-note">${t('This prototype does not generate legal invoices, authenticate signatures or certify physical inspection.','هذا النموذج لا يصدر فواتير قانونية ولا يصادق على التوقيعات أو الفحص الفعلي.')}</p></div>`}
function taskRail(o){const mineTs=mine(o),ownTs=ownTasks(o);let html='';if(mineTs.length){html+=mineTs.map(a=>`<section class="current-task"><div class="eyebrow">${t('YOUR NEXT ACTION','خطوتك التالية')}</div><h3>${tx(a.title)}</h3><p>${tx(a.body)}</p>${button(getActionLabel(a.action),'task',o.id+'|'+a.action,'primary')}<div class="owner-badge"><span class="avatar">${roleObj().initial}</span><div><small>${t('Action owner','مسؤول الإجراء')}</small><strong>${tx(roleObj().name)} · ${tx(roleObj().label)}</strong></div></div></section>`).join('')}else{let text=t('No action needed from you. We’ll bring the work back when it is your turn.','لا إجراء مطلوب منك. سيعود العمل إليك عندما يحين دورك.');if(o.phase==='seller_so'&&ui.side==='seller')text=t('Commercially accepted. The SO handoff is pending. Finance cannot start until the ERP confirms a reference.','تم القبول التجاري. ربط أمر البيع معلق. لا تبدأ المالية حتى يؤكد ERP المرجع.');if(o.phase==='credit_ready')text=ui.side==='seller'?t('Credit preparation is complete. Posting remains a manual external ERP step; it is not verified here.','اكتمل تجهيز الإشعار الدائن. الترحيل خطوة يدوية خارجية في ERP ولا يتم التحقق منها هنا.'):t('Returned goods were acknowledged. No issued credit note has been confirmed.','أُقر باستلام البضاعة المرتجعة. لم يُؤكد إصدار إشعار دائن بعد.');html+=`<section class="current-task waiting"><div class="eyebrow">${isComplete(o)?t('COMPLETED WORKFLOW','مسار مكتمل'):t('WAITING ON THE NEXT OWNER','بانتظار المسؤول التالي')}</div><h3>${E(ownerText(o))}</h3><p>${text}</p></section>`}
 html+=`<div class="stack"><section class="panel rail-section"><h3>${t('Order context','سياق الطلب')}</h3><dl class="facts"><div><dt>${t('Product lines','بنود المنتجات')}</dt><dd>${o.lines.length}</dd></div>${financialRole()?`<div><dt>${t('Requested value','القيمة المطلوبة')}</dt><dd>${money(val(o.lines))}</dd></div><div><dt>${t('Payment terms','شروط السداد')}</dt><dd>${t('Net ','السداد خلال ')}<bdi>${o.terms}</bdi>${t(' days',' يومًا')}</dd></div>`:''}<div><dt>${t('Requested date','التاريخ المطلوب')}</dt><dd>${dateLabel(o.requestedDate)}</dd></div><div><dt>${t('Destination','الوجهة')}</dt><dd>${tx(company(o.location).place)}</dd></div>${o.booking?`<div><dt>${o.booking.status==='confirmed'?t('Agreed window','الفترة المتفق عليها'):t('Proposed window','الفترة المقترحة')}</dt><dd>${dateLabel(o.booking.date)}<br><bdi>${E(o.booking.start)}–${E(o.booking.end)}</bdi><br><small>${t('Saudi time','بتوقيت السعودية')}</small></dd></div>`:''}</dl></section><section class="panel rail-section"><h3>${icon('lock')} ${t('Private by default','خاص افتراضيًا')}</h3><p>${t('The other company sees published requests, commitments and reports—not your internal approvals, pricing discussions or task owners.','ترى الشركة الأخرى الطلبات والالتزامات والتقارير المنشورة، وليس اعتماداتك أو مناقشات التسعير أو أصحاب المهام الداخلية.')}</p></section></div>`;
 const next=tasks(o).find(a=>!(a.side===ui.side&&a.role===ui.role));if(next&&next.side==='buyer')html+=`<div class="debug-next"><span>${t('DEMO ONLY · Follow the next handoff','للعرض فقط · تابع الإحالة التالية')}</span>${button(E(roleName(next.side,next.role))+' '+icon('arrow'),'preview-owner',o.id+'|'+next.side+'|'+next.role)}</div>`;return html}
function renderTransaction(o){const tabs=[['shared',t('Company conversation','تواصل الشركتين')],['internal',t('My company','شركتي')],['items',t('Order details','تفاصيل الطلب')],['documents',t('Documents','المستندات')]];return `${transactionHead(o)}${stepStrip(o)}<div class="shared-layout"><section class="panel"><div class="tabs transaction-tabs" role="group">${tabs.map(([k,l])=>`<button class="${ui.tab===k?'active':''}" data-do="transaction-tab" data-value="${k}" aria-pressed="${ui.tab===k}">${k==='internal'?icon('lock'):''}${l}</button>`).join('')}</div>${ui.tab==='internal'?internalPanel(o):ui.tab==='items'?productTable(o):ui.tab==='documents'?documentsPanel(o):sharedTimeline(o)}</section><aside>${taskRail(o)}</aside></div>`}
function renderPulse(){const os=visibleOrders().filter(o=>!isComplete(o)),groups=['approval','confirmation','delivery','receipt'];const flagged=os.filter(o=>o.attention);return `${pageHead(t('Operational Pulse','نبض العمليات'),t('Exception-first oversight. Open the underlying records when a stage needs attention.','متابعة تبدأ بالاستثناءات. افتح السجلات الأصلية عندما تحتاج مرحلة إلى متابعة.'))}<div class="work-intro"><span class="spark">${icon('pulse')}</span><p><b>${os.length}</b> ${t('active transactions','معاملات نشطة')} · <b>${flagged.length}</b> ${t('flagged for review in this illustrative snapshot.','معاملات معلّمة للمراجعة في هذه اللقطة التوضيحية.')}</p></div><div class="stage-buttons">${groups.map(g=>`<button class="stage-button" data-do="pulse-filter" data-value="${g}"><strong>${E(filterName(g))}</strong><b>${os.filter(o=>phaseGroup(o)===g).length}</b><small>${t('Investigate records','راجع السجلات')} →</small></button>`).join('')}<button class="stage-button" data-do="pulse-filter" data-value="attention"><strong>${t('Needs attention','يتطلب المتابعة')}</strong><b>${flagged.length}</b><small>${t('Counts may overlap','قد تتداخل الأعداد')}</small></button></div><div class="section-label"><h2>${t('Needs attention','يتطلب المتابعة')}</h2></div>${flagged.map(o=>`<article class="task urgent"><div class="task-top">${companyMark(party(o))}<div><div class="task-title">${tx(company(party(o)).name)}</div><div class="task-ref"><bdi>${E(o.po)}</bdi></div></div>${badge(E(sharedStatus(o)),'amber')}</div><div class="task-body"><h3>${tx((ownTasks(o)[0]||tasks(o)[0]||{}).title||pair('Transaction requires follow-up','المعاملة تتطلب المتابعة'))}</h3><p>${t('Next owner: ','المسؤول التالي: ')}${E(ownerText(o))}. ${t('A flag is a review signal, not permission to override policy.','التنبيه إشارة للمراجعة وليس تصريحًا لتجاوز السياسة.')}</p></div><div class="task-footer"><span class="task-meta">${t('One canonical transaction','معاملة موحدة واحدة')}</span>${button(t('Investigate','مراجعة التفاصيل'),'open',o.id,'primary')}</div></article>`).join('')||empty(t('No current exceptions','لا استثناءات حالية'),t('No flagged transactions in the available data.','لا توجد معاملات معلّمة في البيانات المتاحة.'))}`}
function taskPageShell(o,a,content,footerHtml='',wide=false){return `<div class="back">${linkButton(t('Back to Action Center','العودة إلى مركز العمل'),'nav','work','back')}</div>${pageHead(tx(a.title),`<bdi>${E(o.po)}</bdi> · ${tx(company(party(o)).name)}`)}<div class="status-banner ${a.tone?'amber-bg':''}"><span class="status-icon">${icon(a.side==='buyer'&&a.role==='receiving'?'box':'work')}</span><div class="grow"><h2>${t('One next action. Then the handoff.','إجراء واحد ثم إحالة المتابعة.')}</h2><p>${tx(a.body)}</p></div><div class="status-owner"><small>${t('Current owner','المسؤول الحالي')}</small><b>${tx(roleObj().name)} · ${tx(roleObj().label)}</b></div></div><div class="${wide?'review-layout':'detail-grid'}"><section class="panel">${content}${footerHtml}</section><aside class="stack">${wide?`<div class="panel">${samplePO(o)}</div>`:`<section class="panel rail-section"><h3>${t('Transaction context','سياق المعاملة')}</h3><dl class="facts"><div><dt>${t('Counterparty','الشركة الأخرى')}</dt><dd>${tx(company(party(o)).name)}</dd></div><div><dt>${t('Reference','المرجع')}</dt><dd><bdi>${E(o.po)}</bdi></dd></div>${financialRole()?`<div><dt>${t('Requested value','القيمة المطلوبة')}</dt><dd>${money(val(o.lines))}</dd></div>`:''}<div><dt>${t('Requested date','التاريخ المطلوب')}</dt><dd>${dateLabel(o.requestedDate)}</dd></div><div><dt>${t('Destination','الوجهة')}</dt><dd>${tx(company(o.location).place)}</dd></div></dl><div class="mt24">${linkButton(t('View company conversation','عرض تواصل الشركتين'),'open',o.id)}</div></section>`}<section class="panel rail-section"><h3>${icon('lock')} ${t('Scope of this action','نطاق هذا الإجراء')}</h3><p>${['buyer-finance','buyer-approve','seller-review','seller-approve','reply-question','physical-return','prepare-credit','verify-invoice','resume','edit'].includes(a.action)?t('This work is private to your company. Only an explicitly published business event appears in the shared channel.','هذا العمل خاص بشركتك. لا يظهر في القناة المشتركة إلا إجراء عمل منشور صراحةً.'):t('The form names what will be shared. Private discussions and the other company’s internal workflow remain separate.','يوضح النموذج ما سيُشارك. تبقى المناقشات الخاصة والعمل الداخلي للشركة الأخرى منفصلة.')}</p></section></aside></div>`}
function taskForm(o,action,body,primary,secondary=''){return `<form id="task-form" data-task-form="${E(action)}" data-id="${o.id}" data-version="${o.version}"><div class="panel-pad">${body}<div class="error" id="task-error" role="alert"></div></div><div class="form-footer"><span class="saved-note">${t('Original facts and decision history are preserved.','تُحفظ الوقائع الأصلية وسجل القرارات.')}</span><div class="button-row">${secondary}<button type="submit" class="btn primary">${primary}${icon('arrow')}</button></div></div></form>`}
function samplePO(o){return `<div class="source-top"><span>${t('Source purchase order','أمر الشراء الأصلي')}</span><span class="sample-tag">${t('ILLUSTRATIVE DOCUMENT','مستند توضيحي')}</span></div><div class="paper-wrap"><article class="paper" dir="ltr"><div class="paper-brand">${E(company(o.buyer).name.en)}</div><div class="paper-heading">PURCHASE ORDER</div><div class="paper-meta"><span>${E(o.po)}<br>14 Sep 2026</span><span>To: ${E(company(o.seller).name.en)}<br>Requested: ${E(o.requestedDate)}</span></div><table class="paper-table"><thead><tr><th>Product</th><th>Qty</th>${financialRole()?'<th>SAR / unit</th>':''}</tr></thead><tbody>${o.lines.map(l=>`<tr><td>${E(l.name.en||l.name)}</td><td>${l.qty}</td>${financialRole()?`<td>${(l.price/100).toFixed(2)}</td>`:''}</tr>`).join('')}</tbody></table>${financialRole()?`<div class="paper-total">Net total: SAR ${(val(o.lines)/100).toFixed(2)}</div>`:''}<p style="font-size:10px;margin-top:24px">Please reference this PO on delivery documents.<br>Receiving: Central warehouse · Gate 2.</p><div class="paper-stamp">SAMPLE · NOT A REAL ORDER</div></article></div>`}
function renderTaskPage(o,action){const a=mine(o).find(x=>x.action===action);if(!a)return `${transactionHead(o)}${info('This task is no longer assigned to this role. The transaction below shows the current owner.','لم تعد هذه المهمة مسندة لهذا الدور. توضح المعاملة أدناه المسؤول الحالي.')}${renderTransaction(o)}`;let content='';
 switch(action){
 case 'buyer-finance':content=taskForm(o,action,`<div class="approval-summary"><h3>${t('Purchase commitment','التزام الشراء')}</h3><div class="value">${money(val(o.lines))}</div><p>${tx(company(o.seller).name)} · ${t('Net ','السداد خلال ')}${o.terms} ${t('days','يومًا')}</p></div><dl class="facts"><div><dt>${t('Supplier account snapshot','لقطة حساب المورد')}</dt><dd>${o.buyerHold?t('Held for review','معلّق للمراجعة'):t('Available for this sample request','متاح لهذا الطلب التوضيحي')}</dd></div><div><dt>${t('Budget reference','مرجع الميزانية')}</dt><dd>${t('Sample approved purchasing budget','ميزانية مشتريات معتمدة توضيحية')}</dd></div></dl>${noteField('note',t('Financial decision note','ملاحظة القرار المالي'),o.financeNote||'')}<div class="mt24">${check('finance-ack',t('I reviewed the supplier account, payment terms and this purchase commitment.','راجعت حساب المورد وشروط السداد والتزام الشراء هذا.'))}</div><div class="inline-actions">${button(t('Return to Procurement','إعادة إلى المشتريات'),'buyer-return',o.id)}${button(t('Hold for review','تعليق للمراجعة'),'hold',o.id)}</div>`,t('Approve financially','اعتماد مالي'));break;
 case 'buyer-approve':content=taskForm(o,action,`<div class="approval-summary"><h3>${t('Prepared by Procurement · reviewed by Finance','جهزته المشتريات · راجعته المالية')}</h3><div class="value">${money(val(o.lines))}</div><p>${tx(company(o.seller).name)} · <bdi>${E(o.po)}</bdi></p></div>${productTable(o)}${noteField('note',t('Decision note','ملاحظة القرار'))}<div class="mt24">${check('purchase-ack',t('I authorize this purchase at the requested quantities and terms.','أعتمد الشراء بالكميات والشروط المطلوبة.'))}</div><p class="readiness-note">${t('This internal approval does not send the PO. Procurement publishes it next. This demo uses an illustrative purchasing approval policy.','هذا الاعتماد الداخلي لا يرسل أمر الشراء. تنشره المشتريات في الخطوة التالية. يستخدم العرض سياسة توضيحية لاعتماد المشتريات.')}</p>`,t('Approve purchase','اعتماد الشراء'),button(t('Return for revision','إعادة للتعديل'),'buyer-return',o.id));break;
 case 'send-po':content=taskForm(o,action,`${info('Your internal approvals remain private. The supplier receives the PO, terms and requested receiving details only.','تبقى اعتماداتك الداخلية خاصة. يستلم المورد أمر الشراء والشروط وتفاصيل الاستلام المطلوبة فقط.')}<div class="approval-summary"><h3>${tx(company(o.seller).name)}</h3><div class="value">${money(val(o.lines))}</div><p><bdi>${E(o.po)}</bdi> · ${o.lines.length} ${t('lines','بنود')}</p></div>${check('send-ack',t('I am authorized to send this purchase order on behalf of the company.','أنا مخول بإرسال أمر الشراء باسم الشركة.'))}`,t('Publish PO to company channel','نشر أمر الشراء في قناة الشركة'));break;
 case 'accept-changes': content=taskForm(o,action,`${info('A supplier proposal is not an agreed order revision until an authorized buyer accepts it.','مقترح المورد ليس تعديلًا متفقًا عليه حتى يوافق مشتري مخول.','amber')}${productTable(o)}<div class="field"><label for="balance">${t('How should the unconfirmed remainder be handled?','كيف تُعالج الكمية المتبقية غير المؤكدة؟')}</label><select id="balance" name="balance"><option value="">${t('Choose a decision…','اختر القرار…')}</option><option value="cancel">${t('Remove the remainder from this order','إلغاء المتبقي من هذا الطلب')}</option><option value="open">${t('Keep the remainder open for Procurement follow-up','إبقاء المتبقي مفتوحًا لمتابعة المشتريات')}</option></select></div>${noteField('note',t('Message to the supplier','رسالة إلى المورد'))}<div class="mt24">${check('changes-ack',t('I accept the proposed quantities and the remainder decision above.','أوافق على الكميات المقترحة وقرار الكمية المتبقية أعلاه.'))}</div>`,t('Accept order revision','قبول تعديل الطلب'),button(t('Request another proposal','طلب مقترح آخر'),'request-revision',o.id));break;
 case 'accept-slot':content=taskForm(o,action,`${appointmentSummary(o)}<dl class="facts"><div><dt>${t('Required paperwork','المستندات المطلوبة')}</dt><dd>${t('Invoice · PO · delivery note','فاتورة · أمر شراء · إشعار تسليم')}</dd></div><div><dt>${t('Receiving instructions','تعليمات الاستلام')}</dt><dd dir="auto">${E(o.booking?.notes||'—')}</dd></div></dl><div class="mt24">${check('slot-ack',t('Our receiving team can accept this delivery at this location, date and time.','يمكن لفريق الاستلام استقبال هذه الشحنة في الموقع والتاريخ والوقت المحدد.'))}</div>`,t('Confirm appointment','تأكيد الموعد'),button(t('Request a different slot','طلب موعد مختلف'),'different-slot',o.id));break;
 case 'receipt':content=`<div class="panel-pad">${appointmentSummary(o)}${info(action==='receipt'?'You inspect and count. Rych records your report and routes any issue to Procurement. It does not decide whether medicines or goods are acceptable.':'Record what happened at the customer. Refused goods are not assumed physically received back.',action==='receipt'?'أنت تفحص وتعدّ. يسجل Rych تقريرك ويوجه أي ملاحظة للمشتريات. لا يقرر مدى قبول الأدوية أو البضاعة.':'سجل ما حدث لدى العميل. لا يُفترض استلام البضاعة المرفوضة فعليًا.')}${deliveryLines(o)}<h3 class="mt24">${t('What happened?','ماذا حدث؟')}</h3><div class="choice-grid">${(action==='receipt'?[['full',pair('Everything received as agreed','استُلم كل شيء حسب الاتفاق'),'check',pair('Report all agreed quantities accepted.','تسجيل قبول جميع الكميات المتفق عليها.')],['partial',pair('There are differences','توجد اختلافات'),'alert',pair('Report quantities, rejected items and reasons.','تسجيل الكميات والبنود المرفوضة والأسباب.')],['refused',pair('Delivery refused','رُفضت الشحنة'),'box',pair('No items were accepted.','لم يُقبل أي صنف.')],['failed',pair('The delivery did not happen','لم يتم التسليم'),'clock',pair('Record a missed or failed appointment.','تسجيل موعد فائت أو متعذر.')]]:[['full',pair('Delivered everything','تسليم جميع الأصناف'),'check',pair('All planned quantities accepted.','قُبلت جميع الكميات المخططة.')],['partial',pair('Partial delivery','تسليم جزئي'),'box',pair('Some lines or quantities were refused.','رُفضت بعض الأصناف أو الكميات.')],['refused',pair('Customer refused delivery','رفض العميل الشحنة'),'alert',pair('Nothing was accepted.','لم تُقبل أي بضاعة.')],['failed',pair('Appointment failed','تعذّر الموعد'),'clock',pair('No delivery completed. Sales will rebook.','لم يُستكمل التسليم. تعيد المبيعات الحجز.')]]).map(([value,title,ic,body])=>`<button class="choice-card" data-do="outcome-form" data-value="${o.id}|${action}|${value}">${icon(ic)}<strong>${tx(title)}</strong><small>${tx(body)}</small></button>`).join('')}</div></div>`;break;
 case 'publish-claim':content=taskForm(o,action,`${receiptSummary(o)}${info('The receiver’s report is private until you publish the claim. The supplier must still respond; no financial credit is inferred.','تقرير المستلم خاص حتى تنشر المطالبة. ما زال رد المورد مطلوبًا ولا يُفترض وجود إشعار دائن.','amber')}${noteField('claim-note',t('What should the supplier resolve?','ما المطلوب من المورد معالجته؟'),o.receipt?.notes||'',true)}<div class="mt24">${check('claim-ack',t('Share this report and its evidence with the supplier.','مشاركة هذا التقرير وأدلته مع المورد.'))}</div>`,t('Send receiving issue to supplier','إرسال ملاحظة الاستلام إلى المورد'));break;
 case 'accept-resolution':content=taskForm(o,action,`<div class="approval-summary"><h3>${o.claim?.proposal==='replacement'?t('Replacement proposed','اقتُرح بديل'):t('Return arrangement proposed','اقتُرح ترتيب للإرجاع')}</h3><p dir="auto">${E(o.claim?.resolutionNote||'')}</p></div>${receiptSummary(o)}${check('resolution-ack',t('I agree to this operational resolution. This does not confirm a credit note or payment.','أوافق على هذه المعالجة التشغيلية. لا يؤكد ذلك إصدار إشعار دائن أو سدادًا.'))}`,t('Accept resolution','قبول المعالجة'));break;
 case 'review-bridge':return renderBridgeTask(o,a);
 case 'bridge-commercial':content=taskForm(o,action,`${info('This is your interpretation of an external reply. It does not expose or control the supplier’s internal workflow.','هذا تفسيرك لرد خارجي. لا يكشف أو يتحكم في العمل الداخلي للمورد.')}<div class="approval-summary"><h3>${t('Supplier offered 60 / 100 kits','عرض المورد 60 / 100 طقم')}</h3><p>${t('Other lines in full · Delivery proposed for 15 September, 10:00–12:00.','بقية الأصناف كاملة · التسليم مقترح في 15 سبتمبر، 10:00–12:00.')}</p></div>${noteField('bridge-note',t('Response to prepare','الرد المراد تجهيزه'),t('We accept 60 kits. Please confirm the delivery date once the account issue is resolved.','نوافق على 60 طقمًا. يرجى تأكيد تاريخ التسليم بعد معالجة الحساب.'),true)}${check('bridge-ack',t('Prepare this response for the supplier; do not assume final confirmation.','تجهيز هذا الرد للمورد دون افتراض تأكيده النهائي.'))}`,t('Record commercial response','تسجيل الرد التجاري'));break;
 case 'bridge-finance':content=taskForm(o,action,`${info('The supplier reported an account hold. An internal financial approval does not release the supplier’s hold.','أبلغ المورد عن تعليق الحساب. الاعتماد المالي الداخلي لا يرفع تعليق المورد.','amber')}<div class="source-box" dir="auto">${E(o.bridgeText||'')}</div>${noteField('bridge-note',t('Message to prepare for supplier finance','رسالة تُجهّز لمالية المورد'),t('Please share the outstanding invoice references and confirm the amount required to review the hold.','يرجى مشاركة مراجع الفواتير المستحقة وتأكيد المبلغ المطلوب لمراجعة التعليق.'),true)}${check('bridge-ack',t('Prepare this finance response. No payment or account release is being recorded.','تجهيز الرد المالي. لا يُسجل سداد أو رفع لتعليق الحساب.'))}`,t('Record finance response','تسجيل الرد المالي'));break;
 case 'edit':ui.editId=o.id;return renderNew(o);
 case 'review-balance':content=taskForm(o,action,`${info('The unconfirmed remainder is a separate open purchasing decision. It is not a promised backorder.','المتبقي غير المؤكد قرار شراء مفتوح مستقل وليس طلبًا مؤجلًا مضمونًا.','amber')}${productTable(o)}${noteField('note',t('Reason to close the remainder','سبب إغلاق المتبقي'),'',true)}${check('balance-ack',t('Cancel the unconfirmed remainder on this order. The original requested quantities stay in history.','إلغاء المتبقي غير المؤكد من هذا الطلب. تبقى الكميات الأصلية في السجل.'))}`,t('Close unconfirmed remainder','إغلاق المتبقي غير المؤكد'));break;
 default:content=`<div class="panel-pad">${info('This task has moved. Open the current transaction.','انتقلت هذه المهمة. افتح المعاملة الحالية.')}${button(t('View transaction','عرض المعاملة'),'open',o.id,'primary')}</div>`;
 }
 return taskPageShell(o,a,content)
}
function appointmentSummary(o){const b=o.booking;return `<div class="calendar-summary"><div class="calendar-tile"><span>${t('SEP','سبتمبر')}</span><b>${b?Number(b.date.slice(-2)):14}</b></div><div><h3><bdi>${b?E(b.start)+'–'+E(b.end):'—'}</bdi></h3><p>${b?dateLabel(b.date):dateLabel(o.requestedDate)} · ${t('Saudi time','بتوقيت السعودية')}</p><p>${tx(company(o.location).place)}</p>${b?badge(b.status==='confirmed'?t('Confirmed by receiving','أكدّه الاستلام'):t('Proposed · awaiting agreement','مقترح · بانتظار الموافقة'),b.status==='confirmed'?'green':'amber'):''}</div></div>`}
function deliveryLines(o){return `<div class="mt16">${currentLines(o).map(l=>`<div class="key-line"><strong>${tx(l.name)}<span class="u-block small">${tx(l.unit)}</span></strong><bdi>${l.qty}</bdi></div>`).join('')}</div>`}
function receiptSummary(o){const r=o.receipt||o.originalReceipt;if(!r)return info('No receiving report has been recorded.','لم يُسجل تقرير استلام.');const ls=(o.originalReceipt&&o.replacement?.active)?o.agreed:currentLines(o);return `<section class="approval-summary"><h3>${t('Employee receiving report','تقرير استلام الموظف')} · ${t('human-reported facts','وقائع أبلغ عنها الموظف')}</h3><p>${t('Reported by Faisal · not an automated inspection.','أبلغ عنه فيصل · ليس فحصًا آليًا.')}</p>${r.lines.map(rr=>{const l=ls.find(x=>x.id===rr.id)||o.lines.find(x=>x.id===rr.id);return `<div class="key-line"><strong>${tx(l?.name||pair('Product','منتج'))}</strong><span>${t('Accepted','المقبول')}: <bdi>${rr.accepted}</bdi> / ${t('Received','المستلم')}: <bdi>${rr.received}</bdi></span></div>`}).join('')}<p dir="auto">${E(r.notes||'')}</p>${r.evidence?`<div class="mt16">${linkButton(t('View report evidence','عرض أدلة التقرير'),'evidence-view',typeof r.evidence==='string'?r.evidence:'sample')}</div>`:''}</section>`}
function evidenceBox(id,label){return `<div class="source-evidence" data-evidence-box="${id}"><h3 style="font-size:12px;margin-bottom:7px">${label}</h3><p>${t('PDF, JPG or PNG · max 10 MiB. Files stay on this device. Sample evidence is illustrative, not a real signature or inspection.','PDF أو JPG أو PNG · الحد 10 MiB. تبقى الملفات على هذا الجهاز. الدليل التوضيحي ليس توقيعًا أو فحصًا حقيقيًا.')}</p><div class="row"><label class="btn" for="${id}-file">${icon('upload')}${t('Choose file','اختيار ملف')}</label><input id="${id}-file" data-evidence-input="${id}" type="file" accept="application/pdf,image/jpeg,image/png" style="position:absolute;width:1px;height:1px;min-height:1px;opacity:0"><button class="btn" data-do="sample-evidence" data-value="${id}" type="button">${t('Use sample evidence','استخدام دليل توضيحي')}</button></div><input type="hidden" id="${id}" name="${id}" value=""><div class="evidence-display" id="${id}-display" aria-live="polite"></div></div>`}
function invoiceChecks(o){if(!o.invoice)return [];const inv=o.invoice;const checks=[];const add=(key,en,ar,expected,actual)=>checks.push({key,label:pair(en,ar),expected,actual,result:actual===null||actual===undefined?'unknown':expected===actual?'ok':'bad'});add('buyer','Customer identity','هوية العميل',o.buyer,inv.buyer);add('po','PO reference','مرجع أمر الشراء',o.po,inv.po);add('so','SO reference','مرجع أمر البيع',o.so,inv.so);add('currency','Currency','العملة','SAR',inv.currency);for(const l of agreed(o)){const src=inv.lines.find(x=>x.orderLineId===l.id);add(l.id+'sku',l.name.en+' · SKU',l.name.ar+' · SKU',l.sku,src?.sku);add(l.id+'qty',l.name.en+' · quantity',l.name.ar+' · الكمية',l.qty,src?.qty);add(l.id+'price',l.name.en+' · unit price (minor units)',l.name.ar+' · سعر الوحدة (هللات)',l.price,src?.price)}add('lines','Invoice line count','عدد بنود الفاتورة',agreed(o).length,inv.lines.length);add('net','Net total (minor units)','الإجمالي الصافي (هللات)',val(agreed(o)),inv.netCents);add('tax','Source tax amount (minor units)','مبلغ ضريبة المصدر (هللات)',0,inv.taxCents);return checks}

async function getFile(id){if(evidenceMemory.has(id))return evidenceMemory.get(id);const store=await db();if(!store)return null;return new Promise(resolve=>{try{const req=store.transaction('files').objectStore('files').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)}catch{resolve(null)}})}
function renderEvidenceDisplay(id,value,meta=null){const target=$('#'+id+'-display');if(!target)return;target.innerHTML=`<div class="evidence-attachment">${icon('order')}<div><strong>${value==='sample'?t('Illustrative sample evidence','دليل توضيحي نموذجي'):E(meta?.name||t('Locally attached evidence','دليل مرفق محليًا'))}</strong><small>${value==='sample'?t('Not a real signature or inspection','ليس توقيعًا أو فحصًا حقيقيًا'):meta?.persisted?t('Stored on this device','محفوظ على هذا الجهاز'):t('Available in this session','متاح في هذه الجلسة')}</small></div>${linkButton(t('Preview','معاينة'),'evidence-view',value,'eye')}${linkButton(t('Remove','إزالة'),'remove-evidence',id,'close')}</div>`}
function sampleEvidence(){return `<div class="protected-preview"><span class="sample-tag">${t('ILLUSTRATIVE SAMPLE','مثال توضيحي')}</span><h3>${t('Delivery / receiving evidence','أدلة التسليم / الاستلام')}</h3><p>${t('This placeholder represents where an authorized employee attaches real evidence. It is not a photograph of goods, a signed document or proof of an inspection.','يمثل هذا المثال موضع إرفاق الموظف المخول للدليل الحقيقي. ليس صورة للبضاعة أو مستندًا موقّعًا أو إثباتًا لفحص.')}</p><div class="mt24">${icon('order')}</div></div>`}
async function evidencePreview(id){if(id==='sample'){modal(t('Sample evidence preview','معاينة الدليل التوضيحي'),sampleEvidence());return}const rec=await getFile(id);if(!rec){modal(t('Evidence unavailable','الدليل غير متاح'),info('The original local file is not available in this browser session. Reattach it; a filename alone is not evidence.','الملف المحلي الأصلي غير متاح في هذه الجلسة. أعد إرفاقه؛ اسم الملف وحده ليس دليلًا.'));return}const url=URL.createObjectURL(rec.blob);modal(E(rec.name),`${rec.type.startsWith('image/')?`<img src="${url}" alt="${E(rec.name)}" style="width:100%;max-height:60vh;object-fit:contain">`:`<object type="application/pdf" data="${url}" style="width:100%;height:55vh"><p>${t('Your browser cannot preview this PDF here. The original file remains attached locally.','لا يمكن للمتصفح معاينة PDF هنا. يبقى الملف الأصلي مرفقًا محليًا.')}</p></object>`}<p class="readiness-note">${t('Original local attachment. This preview does not certify its contents.','المرفق المحلي الأصلي. لا تصادق هذه المعاينة على محتواه.')}</p>`,{wide:true});$('#modal').addEventListener('close',()=>URL.revokeObjectURL(url),{once:true})}
function documentPreview(o,type){if(!canSee(o))return;let body='';if(type==='po')body=o.sourceFile?`<div class="note">${t('An original source file is attached. The formatted order below contains the reviewed manual data.','يوجد ملف أصلي مرفق. يحتوي أمر الشراء المنسق أدناه على البيانات المدخلة يدويًا بعد مراجعتها.')}<div class="mt16">${button(t('Open original attachment','فتح المرفق الأصلي'),'attachment',o.sourceFile.id)}</div></div>`+samplePO(o):samplePO(o);if(type==='invoice'){if(!financialRole())return;body=`<div class="sample-tag">${t('ILLUSTRATIVE ERP INVOICE','فاتورة ERP توضيحية')}</div><h3 class="mt16"><bdi>${E(o.invoice.ref)}</bdi></h3><p class="small mt8">${t('Separate sample source · not a legal invoice','مصدر نموذجي مستقل · ليس فاتورة قانونية')}</p>${o.invoice.lines.map(l=>`<div class="key-line"><span><bdi>${E(l.sku)}</bdi> · ${l.qty} × ${money(l.price)}</span><b>${money(l.qty*l.price)}</b></div>`).join('')}<div class="key-line"><span>${t('Source net total','صافي إجمالي المصدر')}</span><b>${money(o.invoice.netCents)}</b></div>`}if(type==='receipt')body=receiptSummary(o);if(type==='proof'){if(o.delivery?.proof==='sample')body=sampleEvidence();else {evidencePreview(o.delivery?.proof);return}}modal(t('Document preview','معاينة المستند'),body,{wide:true})}
function demoModal(){modal(t('Merchant demo controls','أدوات عرض التاجر'),`<p>${t('Use Start here for the guided paths. Reset restores the sample data on this device.','استخدم ابدأ هنا للمسارات الإرشادية. تعيد إعادة الضبط البيانات النموذجية على هذا الجهاز.')}</p><div class="button-row mt24">${button(t('Guided paths','المسارات الإرشادية'),'guide')}${button(t('Reset demo','إعادة ضبط العرض'),'reset','','danger')}</div>`)}

function inviteModal(relId){const r=state.relationships.find(x=>x.id===relId);if(!r||r[ui.side]!==activeCompany())return;const other=r[ui.side==='seller'?'buyer':'seller'];const inv=state.invitations.find(x=>x.rel===r.id);modal(t('Open a company channel','فتح قناة للشركة'),`<p>${t('Invite the business to claim its side of a relationship—not your employees’ personal contacts.','ادعُ الشركة لتفعيل جانبها من العلاقة وليس جهات الاتصال الشخصية للموظفين.')}</p><div class="invite-preview"><div class="shell-brand"><span class="shell-mark">↗</span><span>Rych</span></div><span class="mini-label mt16">${t('INVITATION PREVIEW · NOTHING IS SENT','معاينة الدعوة · لا يُرسل شيء')}</span><h3>${tx(company(activeCompany()).name)} ${t('invites your company to Rych.','تدعو شركتك إلى Rych.')}</h3><p>${t('Keep our orders, confirmations, receiving appointments and delivery issues together in one company channel. Your internal work stays private.','لنجمع طلباتنا وتأكيداتنا ومواعيد الاستلام وملاحظات التسليم في قناة واحدة للشركتين. يبقى عملك الداخلي خاصًا.')}</p><p>${t('You can respond to a transaction first. Adopting a full workspace is not required.','يمكنك الاستجابة لمعاملة واحدة أولًا دون الحاجة إلى تبني مساحة عمل كاملة.')}</p></div><div class="invitation-status">${inv?t('Demo invitation prepared. No email or WhatsApp was sent.','جُهزت الدعوة التجريبية. لم يُرسل بريد أو واتساب.'):t('Preview only. Create a local invitation record to demonstrate the invitation lifecycle.','معاينة فقط. أنشئ سجل دعوة محليًا لعرض مسار الدعوة.')}</div><div class="mt16">${r.connected?badge(t('Already connected','متصل بالفعل'),'green'):button(t('Create demo invitation','إنشاء دعوة تجريبية'),'create-invite',r.id)}</div>`)}
function permissionsModal(){const r=roleObj();modal(t('Your role in this workspace','دورك في مساحة العمل'),`<div class="row"><span class="avatar">${r.initial}</span><div><h3>${tx(r.name)} · ${tx(r.label)}</h3><p>${tx(company(activeCompany()).name)}</p></div></div><p class="mt24">${tx(r.job)}</p><div class="note mt16">${t('You see your assigned actions and entitled transaction context. Another role’s task remains read-only until that role acts. The selector in the demo deliberately lets a presenter explore roles.','ترى الإجراءات المسندة لك وسياق المعاملة المسموح. تبقى مهمة الدور الآخر للقراءة فقط حتى ينفذها. يتيح محدد العرض للمقدم استكشاف الأدوار عمدًا.')}</div><p>${t('Production permissions must be enforced on the server. This offline HTML is not a security boundary.','يجب فرض صلاحيات الإنتاج من الخادم. هذا الملف المحلي ليس حاجزًا أمنيًا.')}</p>`)}
function updatesModal(){const notes=state.notifications.filter(n=>n.side===ui.side&&n.role===ui.role);modal(t('Your work updates','تحديثات مهامك'),`<p>${t('Local workflow handoffs only. No emails or push notifications are sent.','إحالات محلية لمسار العمل فقط. لا يُرسل بريد أو إشعار دفع.')}</p>${notes.map(note=>`<div class="search-result"><span class="avatar">${roleObj().initial}</span><div><b>${tx(note.title)}</b><p><bdi>${E(findOrder(note.record)?.po||'')}</bdi> · ${t('Next action assigned to you','أُسندت لك الخطوة التالية')}</p></div>${linkButton(t('Open','فتح'),'notification-open',note.record)}</div>`).join('')||empty(t('You’re up to date','أنت مطلع على آخر المستجدات'),t('New committed handoffs will appear here.','ستظهر هنا إحالات العمل المسجلة الجديدة.'))}`);notes.forEach(n=>n.read=true);save(STORE,state)}
function searchModal(){modal(t('Find a transaction or company','ابحث عن معاملة أو شركة'),`<div class="field-search search-barwide">${icon('search')}<input id="global-search-input" placeholder="${t('Try PO-4831 or a company name…','جرّب PO-4831 أو اسم الشركة…')}" aria-label="${t('Search transactions','البحث في المعاملات')}"></div><div id="search-results"></div>`);function results(){const q=$('#global-search-input').value.toLowerCase();const list=visibleOrders().filter(o=>(o.po+' '+company(party(o)).name.en+' '+company(party(o)).name.ar).toLowerCase().includes(q));$('#search-results').innerHTML=list.slice(0,8).map(o=>`<div class="search-result">${companyMark(party(o))}<div><b><bdi>${E(o.po)}</bdi> · ${tx(company(party(o)).name)}</b><p>${E(sharedStatus(o))}</p></div>${linkButton(t('Open','فتح'),'notification-open',o.id)}</div>`).join('')||empty(t('No matching records','لا سجلات مطابقة'),t('Try a reference or company in this workspace.','جرّب مرجعًا أو شركة في هذه المساحة.'))}results();$('#global-search-input').addEventListener('input',results)}
function reasonModal(type,o){const cfg={hold:{title:t('Put this review on hold','تعليق المراجعة'),label:t('Record hold','تسجيل التعليق')},'buyer-return':{title:t('Return the purchase for revision','إعادة طلب الشراء للتعديل'),label:t('Return to Procurement','إعادة إلى المشتريات')},'request-revision':{title:t('Ask for a revised supplier proposal','طلب مقترح معدل'),label:t('Request revision','طلب التعديل')},'different-slot':{title:t('Request a different receiving slot','طلب موعد استلام مختلف'),label:t('Send request','إرسال الطلب')}}[type];if(!cfg)return;const v=o.version;modal(cfg.title,`<form id="reason-form">${noteField('modal-reason',t('Reason','السبب'),'',true)}${formFooter(cfg.label)}</form>`);$('#reason-form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;try{sameVersion(o,v);const why=formText(new FormData(form),'modal-reason',true);const allowed=type==='hold'?ui.role==='finance'&&['buyer_finance','buyer_finance_hold'].includes(o.phase):type==='buyer-return'?['finance','executive'].includes(ui.role)&&['buyer_finance','buyer_finance_hold','buyer_approval'].includes(o.phase):type==='request-revision'?permittedAction('accept-changes',o):permittedAction('accept-slot',o);requireValue(allowed,'This action is not assigned to this role.','هذا الإجراء غير مسند لهذا الدور.');await commit(o,v,()=>{if(type==='hold'){o.holdReason=why;o.buyerHold=true;o.phase='buyer_finance_hold';privateEvent(o,'decision_held','Review put on hold','عُلّقت المراجعة',why,why)}else if(type==='buyer-return'){o.phase='buyer_revision';o.buyerFinanceApproved=false;o.buyerExecutiveApproved=false;privateEvent(o,'revision_requested','Procurement revision requested','طُلب تعديل من المشتريات',why,why)}else if(type==='request-revision'){o.previousProposals=[...(o.previousProposals||[]),clone(o.proposed)];o.phase='seller_decision';o.sellerApproved=false;o.changeReason=pair(why,why);publish(o,'revision_requested','Buyer requested a revised proposal','طلب المشتري مقترحًا معدلًا',why,why)}else{o.phase='seller_booking';if(o.booking)o.booking.status='change_requested';publish(o,'appointment_change_requested','Different receiving time requested','طُلب موعد استلام مختلف',why,why)}});closeModal(true)}catch(err){fail(err.message,form)}})}

function go(page,options={}){if(ui.page==='new')syncNewDraft();ui.guide=false;ui.guest=false;ui.page=page;Object.assign(ui,options);if(page==='work')ui.workFilter='mine';writeHash();render();$('#workspace-scroll').scrollTop=0}
function writeHash(){const detail=ui.page==='transaction'?'/'+ui.id+'/'+ui.tab:ui.page==='task'?'/'+ui.id+'/'+ui.action:ui.page==='channel'?'/'+ui.channel:'';const hash='#'+ui.side+'/'+ui.role+'/'+ui.page+detail;try{history.replaceState(null,'',hash)}catch{window.location.hash=hash}}
function routeHash(){const p=location.hash.slice(1).split('/');if(p[0]!=='buyer'||!roles.buyer[p[1]]){ui.side='buyer';ui.role='procurement';ui.page='work';writeHash();return;}ui.side=p[0];ui.role=p[1];ui.page=p[2]||'work';if(['transaction','task'].includes(ui.page)){ui.id=p[3];if(ui.page==='transaction')ui.tab=p[4]||'shared';else ui.action=p[4]}if(ui.page==='channel')ui.channel=p[3];ui.guide=false;ui.guest=false}
function switchRole(role){if(!roles[ui.side][role])return;syncNewDraft();ui.role=role;ui.guide=false;if(ui.page==='task')ui.page='transaction';if(ui.page==='new'||ui.page==='pulse')ui.page='work';ui.tab='shared';prefs.side=ui.side;prefs.role=ui.role;save(PREF,prefs);writeHash();render();$('#workspace-scroll').scrollTop=0}
async function submitNew(form){syncNewDraft();const d=newDraft;requireValue(d.po.trim(),'Enter the PO reference.','أدخل مرجع أمر الشراء.');requireValue(d.date>=DEMO_DATE,'Choose a date on or after the demo day.','اختر تاريخًا في يوم العرض أو بعده.');requireValue(d.lines.length>0,'Add at least one product line.','أضف بند منتج واحدًا على الأقل.');const ls=d.lines.map(l=>{requireValue(txt(l.name).trim()&&Number.isInteger(l.qty)&&l.qty>0&&Number.isInteger(l.price)&&l.price>0,'Each line requires a product, a positive whole quantity and a positive unit price.','يتطلب كل بند صنفًا وكمية صحيحة موجبة وسعر وحدة موجبًا.');return {...clone(l),available:Math.max(l.qty,Number(l.available)||0)}});requireValue(!state.orders.some(o=>o.po.toLowerCase()===d.po.trim().toLowerCase()&&o.id!==d.id&&o.buyer===(ui.side==='buyer'?'zahra':d.counterparty)&&o.seller===(ui.side==='seller'?'phc':d.counterparty)),'That company already has a PO with this reference. Open the existing record.','لدى الشركة أمر شراء بهذا المرجع. افتح السجل الحالي.');let o=d.id?findOrder(d.id):makeOrder(uid('new'),ui.side==='buyer'?'buyer_finance':'seller_review');if(d.id)requireValue(!o.sent&&['buyer_draft','buyer_revision'].includes(o.phase),'Only an unsent draft can be edited.','يمكن تعديل المسودة غير المرسلة فقط.');o.po=d.po.trim();o.lines=ls;o.buyer=ui.side==='buyer'?'zahra':d.counterparty;o.seller=ui.side==='seller'?'phc':d.counterparty;o.location=o.buyer;o.requestedDate=d.date;o.terms=d.terms;o.note=d.note;o.sourceFile=d.file;o.sent=ui.side==='seller';o.source=d.file?'manual':'structured';o.sourceReviewed=false;o.phase=ui.side==='buyer'?'buyer_finance':'seller_review';o.version++;if(!d.id){baseEvents(o);state.orders.unshift(o)}else privateEvent(o,'draft_revised','Purchase request revised','عُدل طلب الشراء','Resubmitted for financial review.','أُعيد للاعتماد المالي.');persist();newDraft=null;try{localStorage.removeItem(STORE+'-draft-'+ui.side)}catch{}go('transaction',{id:o.id,tab:ui.side==='buyer'?'internal':'shared'});toast(t('PO recorded locally. The next owner has the review.','سُجل أمر الشراء محليًا. المراجعة لدى المسؤول التالي.'))}

 case 'sample-evidence':{const inp=$('#'+value);if(inp){inp.value='sample';renderEvidenceDisplay(value,'sample');inp.dispatchEvent(new Event('input',{bubbles:true}));}break}
 case 'remove-evidence':{const inp=$('#'+value);if(inp){inp.value='';$('#'+value+'-display').innerHTML='';inp.dispatchEvent(new Event('input',{bubbles:true}))}break}
 case 'evidence-view':case 'attachment':await evidencePreview(value);break;
 case 'document':{const [id,type]=value.split('|');documentPreview(findOrder(id),type);break}
 case 'invite':inviteModal(value);break;
 case 'create-invite':{const r=state.relationships.find(x=>x.id===value);if(!r||r[ui.side]!==activeCompany())return;if(!state.invitations.some(x=>x.rel===r.id))state.invitations.push({id:uid('invite'),rel:r.id,status:'prepared',from:activeCompany(),at:DEMO_TIME});persist();inviteModal(value);break}
 case 'external-demo':{const o=findOrder(value);const next=o.phase==='external_confirmed'?'confirm':o.phase==='seller_delivery'?'dispatch':'deliver';const title=next==='confirm'?t('Simulate supplier confirmation','محاكاة تأكيد المورد'):next==='dispatch'?t('Simulate supplier dispatch','محاكاة إرسال المورد'):t('Simulate supplier delivery report','محاكاة تقرير تسليم المورد');confirmDialog(title,info('A clearly labelled external-party simulation. No WhatsApp, email, payment or ERP action is executed.','محاكاة صريحة للشركة الخارجية. لا يُنفذ إجراء واتساب أو بريد أو دفع أو ERP.'),t('Apply sample supplier event','تطبيق حدث مورد توضيحي'),()=>commit(o,o.version,()=>{if(next==='confirm'){o.agreed=clone(o.lines);if(o.bridgeCommercial)o.agreed[0].qty=60;o.booking={date:'2026-09-15',start:'10:00',end:'12:00',contact:'Faisal',reference:'NR-'+o.id,status:'proposed',notes:'Gate 2',requirements:true};o.phase='buyer_slot';event(o,'shared','supplier_confirmed',pair('Supplier confirmed supply and reported hold release · sample','أكد المورد التوريد وأبلغ عن رفع التعليق · مثال'),pair('The sample supplier explicitly confirms the offered quantities and proposes a receiving appointment. This is not inferred from Finance’s earlier reply.','يؤكد المورد النموذجي الكميات المعروضة صراحةً ويقترح موعد استلام. لا يُستنتج ذلك من رد المالية السابق.'),'seller','sales')}else if(next==='dispatch'){o.phase='en_route';o.delivery={dispatched:true};event(o,'shared','dispatched',pair('Supplier reported dispatch · sample','أبلغ المورد عن الإرسال · مثال'),pair('The buyer’s receiver can report the physical arrival independently.','يمكن لمستلم المشتري تسجيل الوصول الفعلي بشكل مستقل.'),'seller','delivery')}else{o.delivery={...o.delivery,outcome:'full',proof:'sample',accepted:currentLines(o).map(l=>({id:l.id,qty:l.qty}))};o.phase=o.receipt?.outcome==='partial'?'buyer_receipt_review':'buyer_receipt';event(o,'shared','delivery_reported',pair('Supplier reported full delivery · sample','أبلغ المورد عن التسليم الكامل · مثال'),pair('A separate supplier report. Buyer receipt has not been inferred.','تقرير مورد مستقل. لم يُفترض استلام المشتري.'),'seller','delivery');tryComplete(o)}}));break}
 default:console.warn('Unknown demo action:',action);
 }
}
/* Expose unavailable external-party steps as demo controls, never as the buyer's permissions. */
const oldTaskRail=taskRail;
taskRail=function(o){let html=oldTaskRail(o);if(o.seller!=='phc'&&ui.side==='buyer'&&['external_confirmed','seller_delivery','en_route'].includes(o.phase))html+=`<div class="debug-next"><span>${t('EXTERNAL PARTY · DEMO ONLY','الشركة الخارجية · للعرض فقط')}</span>${button(t('Simulate supplier update','محاكاة تحديث المورد'),'external-demo',o.id)}</div>`;return html};
/* Work notes are restricted by responsibility as well as company. */
function noteRoles(){if(ui.role==='finance')return ['finance','executive'];if(ui.side==='seller')return ['sales','executive',ui.role];return ['procurement','executive',ui.role]}
const originalComposer=composer;
composer=function(o,priv){let html=originalComposer(o,priv);if(priv){const audience=[...new Set(noteRoles())].map(r=>roleLabel(ui.side,r)).join(' · ');html=html.replace(t('Internal note · your company only','ملاحظة داخلية · شركتك فقط'),t('Private note · ','ملاحظة خاصة · ')+E(audience))}return html};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-do]');if(!el||el.disabled)return;e.preventDefault();try{await handleClick(el.dataset.do,el.dataset.value||'',el)}catch(err){console.error(err);toast(E(err.message||t('The action could not complete.','تعذر إكمال الإجراء.')))}});
document.addEventListener('change',async e=>{const el=e.target;if(el.matches('[data-evidence-input]')){const id=el.dataset.evidenceInput,file=el.files?.[0];if(!file)return;const display=$('#'+id+'-display');display.innerHTML=`<p class="small">${t('Saving local evidence…','جارٍ حفظ الدليل محليًا…')}</p>`;try{const meta=await keepFile(file);state.evidence[meta.id]=meta;save(STORE,state);$('#'+id).value=meta.id;renderEvidenceDisplay(id,meta.id,meta);$('#'+id).dispatchEvent(new Event('input',{bubbles:true}))}catch(err){display.innerHTML=`<div class="error show">${E(err.message)}</div>`;$('#'+id).value=''}return}if(el.id==='new-source-file'){const f=el.files?.[0];if(!f)return;try{syncNewDraft();const meta=await keepFile(f);state.evidence[meta.id]=meta;newDraft.file=meta;save(STORE,state);save(STORE+'-draft-'+ui.side,newDraft);render();toast(t('Source attached locally. Enter its contents manually; no extraction was performed.','أُرفق المصدر محليًا. أدخل محتواه يدويًا؛ لم يُنفذ استخراج.'))}catch(err){fail(err.message,$('#new-order-form'))}}});
document.addEventListener('input',e=>{const el=e.target;const tf=el.closest('#task-form');if(tf){const o=findOrder(tf.dataset.id);if(o){o.drafts['form-'+ui.side+'-'+ui.role+'-'+tf.dataset.taskForm]={version:o.version,fields:captureForm(tf)};save(STORE,state)}}if(el.closest('#modal'))ui.modalDirty=true;if(el.id==='list-search'){const selection=el.selectionStart;ui.query=el.value;const list=filteredOrders();$('#order-results').innerHTML=list.length?orderRows(list):`<div class="empty"><h3>${t('No matching transactions','لا معاملات مطابقة')}</h3><p>${t('Try another company or reference.','جرّب شركة أو مرجعًا آخر.')}</p>${button(t('Clear filters','مسح الفلاتر'),'clear-filters')}</div>`;$('#result-count').textContent=list.length;return}if(el.closest('#new-order-form'))syncNewDraft();const cmp=el.closest('[data-compose]');if(cmp){const o=findOrder(cmp.dataset.id);o.drafts[cmp.dataset.compose+'-'+ui.side+'-'+ui.role]=cmp.elements.message.value;save(STORE,state)}});
document.addEventListener('submit',async e=>{const form=e.target;if(form.matches('[data-task-form]')){e.preventDefault();const b=e.submitter;if(b.disabled)return;b.disabled=true;try{await submitTask(form)}catch(err){fail(err.message,form)}finally{if(b.isConnected)b.disabled=false}}else if(form.id==='new-order-form'){e.preventDefault();try{await submitNew(form)}catch(err){fail(err.message,form)}}else if(form.matches('[data-compose]')){e.preventDefault();const o=findOrder(form.dataset.id),text=form.elements.message.value.trim();if(!text){fail(t('Write a message before sending.','اكتب الرسالة قبل الإرسال.'),form);return}if(!canSee(o))return;const privateNote=form.dataset.compose==='private';if(!privateNote&&!['sales','procurement'].includes(ui.role))return;mutate(o,()=>{event(o,privateNote?ui.side:'shared',privateNote?'private_note':'company_message',privateNote?pair('Internal note','ملاحظة داخلية'):pair('Company message','رسالة الشركة'),pair('',''),ui.side,ui.role,{userText:text,...(privateNote?{roles:[...new Set(noteRoles())]}:{})});delete o.drafts[form.dataset.compose+'-'+ui.side+'-'+ui.role]});render();toast(privateNote?t('Private note saved. Nothing was shared externally.','حُفظت الملاحظة الخاصة. لم يُشارك شيء خارجيًا.'):t('Company message added to this local transaction.','أُضيفت رسالة الشركة إلى هذه المعاملة المحلية.'))}});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}if(e.target.matches('.persona-tab')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const keys=Object.keys(roles[ui.side]);let i=keys.indexOf(ui.role);if(e.key==='Home')i=0;else if(e.key==='End')i=keys.length-1;else i=(i+((e.key==='ArrowRight')!==(prefs.lang==='ar')?1:-1)+keys.length)%keys.length;switchRole(keys[i]);$('#role-'+keys[i]).focus()}});
window.addEventListener('hashchange',()=>{routeHash();render()});
window.addEventListener('storage',e=>{if(e.key===STORE&&e.newValue){try{const updated=JSON.parse(e.newValue);if(updated.revision>state.revision){state=updated;if(!$('#task-form')&&!$('#new-order-form')&&!$('#modal').open)render();else toast(t('Another view updated this record. Review the latest version before saving.','حدّث منظور آخر السجل. راجع أحدث نسخة قبل الحفظ.'))}}catch{}}});
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--demo-height',$('#demo-bar').getBoundingClientRect().height+'px'));

window.RychDemo={getState:()=>clone(state),getUI:()=>clone({...ui,modalSubmit:null}),inspectTasks:id=>clone(tasks(findOrder(id))),show:(side,role,page='work',id=null)=>{if(side!=='buyer'||!roles.buyer[role])return;ui.side='buyer';ui.role=role;ui.page=page;ui.id=id;ui.tab='shared';ui.workFilter='mine';ui.guide=false;ui.guest=false;render()},reset:()=>{state=seed();seedOrders();persist();ui.page='work';ui.id=null;ui.workFilter='mine';render()},setLanguage:lang=>{prefs.lang=lang;save(PREF,prefs);render()},hasAccess:canSee};
